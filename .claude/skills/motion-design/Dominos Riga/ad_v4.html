</style></head><body><canvas id="c"></canvas>
<script>
// Domino's Riga 2+1, v2: "2+1 has always been in our logo". ONE continuous camera over a vector rebuild of the domino tile.
// 2D canvas, 1080x1920. Page contract: renderAt(t), TOTAL, ready, EVENTS, ?t=, ?scale=. All beat times live in B.
// v4 = v3 (treatment.md "Always 2+1") + a domino-effect opening, a 3D tile, depth (bokeh, parallax, light),
// flying pepperoni cut from the real photo and giant outline type. The tile is whole from frame 0: the chain knocks into it.
const CH = { n: 6, pitch: 346, t0: 0.12, step: 0.17, fall: 0.24, lean: 20.6, flat: 41.4 };   // chain: falls right to left... into the tile
const HIT = CH.t0 + (CH.n - 1) * CH.step + CH.fall;                                        // the last domino meets the tile
const B = { d1: -1, d2: -1, d3: -1, tile: -1, fill: -1, nums: 2.4, numsOut: 3.4, dive: 3.6, diveEnd: 4.8, l2: 5.0, l2out: 6.1,
  pan: 6.4, panEnd: 6.95, l3: 7.15, l3out: 8.45, back: 8.7, backEnd: 10.4, rotEnd: 10.6, l4: 9.75, l4out: 11.15, logo: 11.35, logoEnd: 12.2,
  pill: 12.3, l5: 12.95, sweep: 13.0, END: 15 };
const W = 1080, H = 1920, C = [540, 960], q = new URLSearchParams(location.search), SCALE = parseFloat(q.get('scale') || '1');
const BLUE = '#006491', RED = '#E31837';
const cv = document.getElementById('c'); cv.width = W * SCALE; cv.height = H * SCALE; const MAIN = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; return c; };
const TMP = mk(), ACC = mk(), SW = mk(); let ctx;
const clamp01 = v => Math.max(0, Math.min(1, v)), lerp = (a, b, k) => a + (b - a) * k, prog = (t, a, b) => clamp01((t - a) / (b - a));

const img = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
let LOGO, P = {}, PEP = [];

// The tile in its own frame (image px, measured from the official PNG rotated level): blue left, red right, centre (0,0).
const T = { outer: [-199, -103, 398, 206, 12], half: 91.25, hc: 96.75, gap: 5.5, dotR: 32,
  dots: [[-129.25, -33.5], [-63.75, 34], [96.75, 0]] };   // two on the blue half, one on the red half
// Official logo PNG (2000x500): tile centre, tile + wordmark boxes, visible bounding box. In the PNG the tile is turned -45 degrees.
const G = { tileC: [309.5, 244.5], tile: [107, 42, 513, 448], word: [520, 150, 1932, 450], box: [107, 42, 1931, 447] };
const LS = 0.49, LCY = 800;   // end logo scale and the y of its visible centre
const logoX = x => C[0] + (x - (G.box[0] + G.box[2]) / 2) * LS, logoY = y => LCY + (y - (G.box[1] + G.box[3]) / 2) * LS;

// ONE camera: screen = O + Z * R(rot) * (world - F). Zoom only goes in until 9.0 s, then only out; rotation only turns one way.
function cam(t) {
  const lz = Math.log(0.82) + Math.log(0.9 / 0.82) * prog(t, 0, HIT) + Math.log(2.35 / 0.9) * sine(prog(t, HIT, B.dive)) + Math.log(11.0 / 2.35) * ioc(t, B.dive, B.diveEnd)
    + Math.log(11.3 / 11.0) * prog(t, B.diveEnd, B.pan) + Math.log(11.5 / 11.3) * ioc(t, B.pan, B.panEnd) + Math.log(11.9 / 11.5) * prog(t, B.panEnd, B.back)
    + Math.log(1.95 / 11.9) * ioc(t, B.back, B.backEnd) + Math.log(1.88 / 1.95) * prog(t, B.backEnd, B.logo) + Math.log(LS / 1.88) * ioc(t, B.logo, B.logoEnd);
  const rot = -100 + 10 * outCubic(prog(t, 0, B.dive)) + 45 * ioc(t, B.back, B.rotEnd);
  const fx = lerp(lerp(lerp(0, -T.hc, ioc(t, B.dive, B.diveEnd)), T.hc, ioc(t, B.pan, B.panEnd)), 0, ioc(t, B.back, B.backEnd));
  const fy = lerp(-CH.pitch * 4.6, 0, sine(prog(t, 0.0, HIT + 0.2)));   // tracks the falling wave towards the tile
  const k = ioc(t, B.logo, B.logoEnd), O = [lerp(C[0], logoX(G.tileC[0]), k), lerp(C[1], logoY(G.tileC[1]), k)];

}
function withCam(c, fn) { ctx.save(); ctx.translate(c.O[0], c.O[1]); ctx.rotate(c.rot); ctx.scale(c.Z, c.Z); ctx.translate(-c.F[0], -c.F[1]); fn(); ctx.restore(); }

function tile(t, c, a) {   // grows around the dots, then each half fills outward from its own dots
  const kt = outExpo(prog(t, B.tile, B.tile + 0.7)); if (kt <= 0 || a <= 0) return;
  withCam(c, () => {
    ctx.globalAlpha = a; ctx.save(); ctx.scale(lerp(0.82, 1, kt), lerp(0.82, 1, kt)); ctx.globalAlpha = a * clamp01(kt * 2.5);
    const [x, y, w, h, r] = T.outer, near = 1 - prog(c.Z, 3, 6);
    slab(c, x, y, w, h, r, '#AFC0D2', near);   // thickness + contact shadow, faded out once the camera is inside a half
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
    [[-1, BLUE, B.fill, [-96.5, 0]], [1, RED, B.fill + 0.05, T.dots[2]]].forEach(([s, col, t0, o]) => {
      const kf = outCubic(prog(t, t0, t0 + 0.65)); if (kf <= 0) return;
      ctx.save(); ctx.beginPath(); ctx.arc(o[0], o[1], lerp(T.dotR, 140, kf), 0, 7); ctx.clip();
      const x0 = s < 0 ? -T.hc - T.half : T.gap; ctx.beginPath();
      ctx.roundRect(x0, -T.half, T.half * 2 - (T.hc - T.half - T.gap), T.half * 2, s < 0 ? [10, 0, 0, 10] : [0, 10, 10, 0]); ctx.fillStyle = col; ctx.fill(); ctx.restore();
    });

}
// Screen direction of the one light (top left) -> shadows and thickness fall down-right. Converted into the camera's local frame.
function localDir(c, dx, dy) { const a = -c.rot; return [(dx * Math.cos(a) - dy * Math.sin(a)) / c.Z, (dx * Math.sin(a) + dy * Math.cos(a)) / c.Z]; }
function slab(c, x, y, w, h, r, side, a) {   // call inside withCam: soft shadow + 14 px of thickness behind a rounded face
  if (a <= 0) return; const d = localDir(c, 0.5, 0.86);
  ctx.save(); ctx.globalAlpha *= a; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 46 * SCALE; ctx.shadowOffsetX = 14 * SCALE; ctx.shadowOffsetY = 26 * SCALE;
  ctx.beginPath(); ctx.roundRect(x + d[0] * 14, y + d[1] * 14, w, h, r); ctx.fillStyle = side; ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalAlpha *= a; for (let i = 13; i >= 1; i -= 2) { ctx.beginPath(); ctx.roundRect(x + d[0] * i, y + d[1] * i, w, h, r); ctx.fillStyle = i > 7 ? '#8FA3B8' : side; ctx.fill(); } ctx.restore();
}
function sheen(t, c, box) {   // a soft band of light drifting across the face (only while the whole tile is in view)
  const a = 1 - prog(c.Z, 2.6, 4.5); if (a <= 0) return; const [x, y, w, h, r] = box;
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.clip();
  const u = lerp(-1.2, 1.2, (t * 0.22) % 1), g = ctx.createLinearGradient(x + w * (u - 0.3), y, x + w * (u + 0.3), y + h);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, `rgba(255,255,255,${0.22 * a})`); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h); ctx.restore();
}
// Classic dominoes (white face, navy pips) standing to the left of the tile; they fall clockwise about their bottom-right corner.
const PIPS = { 1: [[0, 0]], 2: [[-1, -1], [1, 1]], 3: [[-1, -1], [0, 0], [1, 1]], 4: [[-1, -1], [1, -1], [-1, 1], [1, 1]],
  5: [[-1, -1], [1, -1], [0, 0], [-1, 1], [1, 1]], 6: [[-1, -1], [-1, 0], [-1, 1], [1, -1], [1, 0], [1, 1]] };
const FACES = [[3, 5], [6, 2], [1, 4], [5, 6], [2, 3], [4, 1]];
const fallK = (t, k) => { const p = prog(t, CH.t0 + (CH.n - 1 - k) * CH.step, CH.t0 + (CH.n - 1 - k) * CH.step + CH.fall); return p * p; };
function chain(t, c) {
  const fade = 1 - sine(prog(t, 1.85, 2.35)); if (fade <= 0) return;
  withCam(c, () => { ctx.globalAlpha = fade;
    for (let k = CH.n - 1; k >= 0; k--) {
      const yc = -CH.pitch * (k + 1), phi = (CH.lean * fallK(t, k) + (k > 0 ? CH.flat * fallK(t, k - 1) : 0)) * Math.PI / 180;
      ctx.save(); ctx.translate(-199, yc + 103); ctx.rotate(phi); ctx.translate(199, -(yc + 103));
      const [x, y, w, h, r] = [-199, yc - 103, 398, 206, 12];
      slab(c, x, y, w, h, r, '#C9D3DE', 1);
      ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = '#F4F6F8'; ctx.fill();
      ctx.fillStyle = '#0B2238'; ctx.fillRect(-3, y + 18, 6, h - 36);   // the centre line
      FACES[k].forEach((n, half) => PIPS[n].forEach(([a, b]) => { ctx.beginPath(); ctx.arc((half ? 96.75 : -96.75) + a * 52, yc + b * 52, 19, 0, 7); ctx.fill(); }));
      sheen(t + k * 0.4, c, [x, y, w, h, r]);
      ctx.restore();
    }
  });
  // the knock: a small burst where the last domino meets the tile
  const kb = prog(t, HIT, HIT + 0.35);
  if (kb > 0 && kb < 1) { const p = c.p([199 - 398 * Math.cos(CH.lean * Math.PI / 180) + 20, -103]); ctx.save(); ctx.globalAlpha = 0.8 * (1 - kb); ctx.strokeStyle = '#fff'; ctx.lineWidth = 5 * (1 - kb) + 1;
    for (let i = 0; i < 7; i++) { const a = -Math.PI * 0.95 + i * 0.3, r0 = 18 + kb * 40, r1 = r0 + 26 * (1 - kb) + 8; ctx.beginPath(); ctx.moveTo(p[0] + Math.cos(a) * r0, p[1] + Math.sin(a) * r0); ctx.lineTo(p[0] + Math.cos(a) * r1, p[1] + Math.sin(a) * r1); ctx.stroke(); }
    ctx.restore(); }
}
// Depth: soft out-of-focus lights in brand colours; the back layer moves slower than the camera, the front layer faster.
const BOK = Array.from({ length: 22 }, (_, i) => { const h = n => { const x = Math.sin(i * 127.1 + n * 311.7) * 43758.5453; return x - Math.floor(x); };
  return { x: h(1) * 1300 - 110, y: h(2) * 2200 - 140, r: 60 + h(3) * 170, col: ['0,140,200', '227,24,55', '255,255,255', '0,100,145'][i % 4], a: 0.08 + h(4) * 0.16, front: i % 6 === 0, sp: 0.4 + h(5) }; });
function bokeh(t, c, front) {
  const o = c.p([0, 0]), dx = o[0] - C[0], dy = o[1] - C[1];
  BOK.forEach(b => { if (b.front !== front) return; const par = front ? 1.25 : 0.12;
    const x = ((b.x + dx * par + Math.sin(t * 0.3 * b.sp + b.x) * 40) % 1300 + 1300) % 1300 - 110, y = ((b.y + dy * par - t * 18 * b.sp) % 2200 + 2200) % 2200 - 140;
    const r = b.r * (front ? 1.8 : 1), g = ctx.createRadialGradient(x, y, 0, x, y, r), al = b.a * (front ? 0.45 : 1);
    g.addColorStop(0, `rgba(${b.col},${al})`); g.addColorStop(0.55, `rgba(${b.col},${al * 0.55})`); g.addColorStop(1, `rgba(${b.col},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); });
}
function giant(str, x, y, size, a) {   // huge outline type, a layer of texture rather than something to read
  if (a <= 0.003) return; ctx.save(); ctx.font = `900 ${size}px M`; ctx.letterSpacing = `${-0.04 * size}px`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeText(str, x, y); ctx.restore();
}
// Pepperoni slices cut from the real photo orbit the pizzas, some behind (small, soft) and some in front (big, soft).
const BITS = Array.from({ length: 12 }, (_, i) => { const h = n => { const x = Math.sin(i * 91.3 + n * 47.9) * 24634.6345; return x - Math.floor(x); };
  return { a0: i / 12 * Math.PI * 2 + h(1) * 0.4, rad: 400 + h(2) * 200, z: 0.55 + h(3) * 1.3, sp: (0.25 + h(4) * 0.3) * (i % 2 ? 1 : -1), rot: h(5) * 6, img: i % 8, tilt: 0.55 + h(6) * 0.3 }; });
function bits(t, c, front) {
  [[c.p([-T.hc, 0]), ioc(t, B.dive + 0.35, B.diveEnd + 0.5) * (1 - ioc(t, B.back - 0.1, B.back + 0.7)), 0],
   [c.p([T.hc, 0]), ioc(t, B.pan + 0.45, B.panEnd + 0.6) * (1 - ioc(t, B.back - 0.1, B.back + 0.7)), 1]].forEach(([o, m, w]) => {
    if (m <= 0.01) return;
    BITS.forEach((b, i) => { if ((i + w) % 2) return; if ((b.z > 1.15) !== front) return;
      const ang = b.a0 + t * b.sp, r = b.rad * lerp(0.2, 1, m), x = o[0] + Math.cos(ang) * r, y = o[1] + Math.sin(ang) * r * b.tilt + (w ? 60 : 0);
      const sz = 78 * b.z * m, im = PEP[b.img]; if (!im) return;
      ctx.save(); ctx.globalAlpha = m; ctx.filter = b.z > 1.4 ? `blur(${(b.z - 1.4) * 14 * SCALE}px)` : b.z < 0.8 ? `blur(${(0.8 - b.z) * 10 * SCALE}px)` : 'none';
      ctx.translate(x, y); ctx.rotate(b.rot + t * b.sp * 2); ctx.scale(1, 0.92); ctx.drawImage(im, -sz / 2, -sz / 2, sz, sz); ctx.restore(); });
  });
}
function dot(t, c, i) {   // a dot of the tile; in "pizza mode" it moves to an art-directed spot and the pizza appears on it
  const tA = [B.d1, B.d2, B.d3][i], kk = prog(t, tA, tA + 0.22); if (kk <= 0) return;
  const ka = lerp(1.4, 1, outCubic(kk)), fa = clamp01(kk * 4);   // a dot is SET DOWN like a domino: drops from 140% to 100% in 0.22 s
  const blue = i < 2, m = (blue ? ioc(t, B.dive + 0.2, B.diveEnd + 0.2) : ioc(t, B.pan + 0.4, B.panEnd + 0.4)) * (1 - ioc(t, B.back, B.back + 0.9));
  const base = c.p(T.dots[i]), anchor = c.p(blue ? [-T.hc, 0] : [T.hc, 0]);
  const des = blue ? [anchor[0] + (i ? 215 : -215), anchor[1] + (i ? -235 : 235)] : [anchor[0], anchor[1] + 60], rd = blue ? 245 : 360;
  const x = lerp(base[0], des[0], m), y = lerp(base[1], des[1], m), r = lerp(T.dotR * c.Z, rd, m) * ka;
  if (x < -r || x > W + r || y < -r || y > H + r) return;

  const pr = prog(t, tA + 0.18, tA + 0.7);

  if (pr > 0 && pr < 1) { ctx.save(); ctx.globalAlpha *= 0.35 * (1 - pr); ctx.strokeStyle = '#fff'; ctx.lineWidth = 6 * (1 - pr) + 1; ctx.beginPath(); ctx.arc(x, y, r + 8 + pr * 60, 0, 7); ctx.stroke(); ctx.restore(); }

  ctx.save(); ctx.globalAlpha = pa; ctx.translate(x, y); ctx.rotate((t * [9, -7, 8][i] + [0, 60, 20][i]) * Math.PI / 180); ctx.drawImage(im, -240 * s, -240 * s, 480 * s, 480 * s); ctx.restore();

    const g = ctx.createRadialGradient(wx, wy, 0, wx, wy, wr); g.addColorStop(0, `rgba(255,255,255,${0.13 * sa * Math.sin(Math.PI * ph)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(wx - wr, wy - wr, wr * 2, wr * 2); } ctx.restore();
}
function num(str, x0, x1, y, size, tIn, tOut, t) {   // the count slides OUT from behind its half of the tile, then blurs away

function words(str, x0, y, size, w, col, tIn, tOut, t, stagger = 0.08, align = 'center') {   // word by word: blur -> sharp, small rise; leaves the same way

function frame(t) {

  const g = ctx.createRadialGradient(540, 900, 100, 540, 960, 1300); g.addColorStop(0, '#0E3354'); g.addColorStop(1, '#04121F'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const c = cam(t), swap = prog(t, B.logoEnd, B.logoEnd + 0.15);   // vector tile hands over to the official PNG tile

  words('1 dāvanā!', 540, 360, 120, 900, '#fff', B.l3 + 0.18, B.l3out, t);

const SUB = 10, SHUTTER = 0.5 / 30;   // motion blur: 10 sub-frames over a 180-degree shutter at 30 fps
function render(t) {

}
